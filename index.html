<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess Who?</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f1ea; --fg:#1d1d1f; --card:#fff; --accent:#c8402f; --muted:#777; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1a1c; --fg:#f2f2f2; --card:#2a2a2d; --muted:#999; --line:#3a3a3e; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px; text-align:center; }
  h1 { margin:0 0 12px; font-size:1.6rem; }
  .bar { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  input { font-size:1.1rem; padding:8px 12px; width:9em; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); text-transform:uppercase; text-align:center; }
  button { font-size:1rem; padding:8px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.alt { background:var(--card); color:var(--fg); border:1px solid var(--line); }
  #msg { text-align:center; color:var(--muted); padding:8px; min-height:1.4em; }
  #msg.err { color:var(--accent); }
  #me { display:none; margin:8px auto 16px; max-width:260px; background:var(--card); border:3px solid var(--accent); border-radius:12px; padding:10px; text-align:center; }
  #me img { width:100%; border-radius:8px; display:block; }
  #me .lbl { font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
  #me .nm { font-weight:700; margin-top:6px; }
  #me.hidden-secret img, #me.hidden-secret .nm { display:none; }
  #me.hidden-secret .cover { display:block; }
  .cover { display:none; padding:40px 0; color:var(--muted); }
  #board { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; max-width:1000px; margin:0 auto; padding:0 12px 24px; }
  @media (max-width:800px){ #board{grid-template-columns:repeat(4,1fr);} }
  @media (max-width:480px){ #board{grid-template-columns:repeat(3,1fr); gap:6px;} }
  .card { background:var(--card); border-radius:10px; overflow:hidden; cursor:pointer; position:relative; border:1px solid var(--line); user-select:none; }
  .card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:var(--line); }
  .card .n { font-size:.75rem; text-align:center; padding:4px 2px; line-height:1.2; min-height:2.4em; display:flex; align-items:center; justify-content:center; }
  .card.down { filter:grayscale(1); opacity:.28; }
  .card.down::after { content:"✕"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:3rem; color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Guess Who?</h1>
  <div class="bar">
    <input id="code" placeholder="123A" maxlength="12" autocomplete="off">
    <button id="go">Start</button>
    <button id="new" class="alt">New game</button>
    <button id="toggle" class="alt" style="display:none">Hide my person</button>
    <button id="reset" class="alt" style="display:none">Reset board</button>
  </div>
  <div id="msg">Enter a game code (seed + player letter, e.g. 123A / 123B). Both players use the same seed.</div>
</header>

<div id="me"><div class="lbl">Your person</div><img id="meImg" alt=""><div class="cover">🙈 hidden</div><div class="nm" id="meName"></div></div>

async function load(){
  if (people) return;
  people = DATA.map(p => ({ id:p[0], name:p[1], sex:p[2]==="f"?"female":"male" }));
}

function buildGame(seed){
  const rnd = mulberry32(hash("guesswho:" + seed));
  const f = shuffle(people.filter(p => p.sex === "female"), rnd).slice(0,12);
  const m = shuffle(people.filter(p => p.sex === "male"), rnd).slice(0,12);
  const board = shuffle(f.concat(m), rnd);
  const picks = shuffle(board.map((_,i)=>i), rnd); // distinct indexes
  return { board, secretA: board[picks[0]], secretB: board[picks[1]] };
}

const img = (p, size) => BASE + "portraits/" + size + "/" + p.id + ".avif";

async function start(){
  const raw = $("code").value.trim().toUpperCase();
  const mt = raw.match(/^(.+)([AB])$/);
  if (!mt) return msg("Code must end with A or B, e.g. 123A", true);
  const seed = mt[1], who = mt[2];
  try { await load(); } catch(e){ return msg("Something went wrong (" + e.message + ").", true); }
  const g = buildGame(seed);
  const me = who === "A" ? g.secretA : g.secretB;

  const board = $("board"); board.innerHTML = "";
  g.board.forEach(p => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = '<img loading="lazy" alt=""><div class="n"></div>';
    c.querySelector("img").src = img(p, "s");
    c.querySelector(".n").textContent = p.name;
    c.onclick = () => c.classList.toggle("down");
    board.appendChild(c);
  });

  $("meImg").src = img(me, "m");
  $("meName").textContent = me.name;
  $("me").style.display = "block";
  $("me").classList.remove("hidden-secret");
  $("toggle").textContent = "Hide my person";
  $("toggle").style.display = $("reset").style.display = "";
  msg("Game " + seed + " — you are Player " + who + ". Tap a face to flip it down.");
  location.hash = seed + who;
}

$("go").onclick = start;
$("code").onkeydown = e => { if (e.key === "Enter") start(); };
$("new").onclick = () => {
  const cur = ($("code").value.trim().toUpperCase().match(/([AB])$/) || [,"A"])[1];
  $("code").value = (100 + Math.floor(Math.random()*9900)) + cur;
  start();
};
$("toggle").onclick = () => {
  const h = $("me").classList.toggle("hidden-secret");
  $("toggle").textContent = h ? "Show my person" : "Hide my person";
};
$("reset").onclick = () => document.querySelectorAll(".card.down").forEach(c => c.classList.remove("down"));

if (location.hash.length > 1) { $("code").value = decodeURIComponent(location.hash.slice(1)); start(); }
